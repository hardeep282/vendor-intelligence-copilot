[project]
name = "vendor-intelligence-copilot"
version = "0.0.1"
description = "Agentic commercial decision-support system for a beverage distributor (orchestrator + specialists + Guardian)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75.0",
    "boto3>=1.43.112",
    "chromadb>=1.5.9",
    "duckdb",
    "fastapi>=0.143.0",
    "langgraph>=1.2.15",
    "langsmith>=0.3.0",
    "pandas",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.1.0",
    "shap>=0.49.0",
    "sqlglot>=27.0.0",
    "statsforecast>=2.0.4",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "tokenizers>=0.23.3",
    "xgboost>=3.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "openpyxl",
    "types-PyYAML",
    "pandas-stubs",
    "boto3-stubs[ssm]>=1.43.112",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S608"]
"scripts/build_golden_set.py" = ["E501", "S608", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# rank-bm25 ships no type stubs and no py.typed marker; its surface used here (BM25Okapi,
# get_scores) is tiny and stable, so an untyped import is simpler than hand-rolling a stub file.
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy.stats ships no inline types for this version; `scipy-stubs` pulls in its own numpy
# version constraints that fight the rest of this project's pinned stack, and the surface used
# here (norm.ppf) is one call -- same reasoning as rank_bm25 above.
module = "scipy.stats"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# statsforecast and xgboost ship no py.typed marker either; both have a large, fast-moving
# surface not worth hand-stubbing for the handful of calls this project makes into them.
module = ["statsforecast.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
