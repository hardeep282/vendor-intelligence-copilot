[project]
name = "vendor-intelligence-copilot"
version = "0.1.0"
description = "Agentic commercial decision-support system for a beverage distributor (orchestrator + specialists + Guardian)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75.0",
    "boto3>=1.43.112",
    "chromadb>=1.5.9",
    "duckdb",
    "fastapi>=0.143.0",
    "langgraph>=1.2.15",
    "langsmith>=0.3.0",
    "pandas",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.1.0",
    "shap>=0.49.0",
    "sqlglot>=27.0.0",
    "statsforecast>=2.0.4",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "tokenizers>=0.23.3",
    "xgboost>=3.0.0",
    "uvicorn[standard]>=0.54.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "mcp>=1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "openpyxl",
    "types-PyYAML",
    "pandas-stubs",
    "boto3-stubs[ssm]>=1.43.112",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S608"]
"scripts/build_golden_set.py" = ["E501", "S608", "S101"]
# FastAPI's own DI idiom is `param: T = Depends(get_t)` -- a function call as a default value
# is exactly how a route or dependency declares what it needs; ruff's B008 (generally a real
# footgun -- a mutable default evaluated once at def time) doesn't apply to it, and FastAPI's
# own docs recommend disabling B008 for files that use Depends() this way (Day 8 step 3/4).
"src/copilot/api/*" = ["B008"]
# Day 9 step 1: every function in this module's whole job is building parameterized SQL
# template strings (S608) sampled with a non-cryptographic RNG (S311) -- training-data
# generation, not a security boundary; the SQL it builds is re-validated by the real
# `copilot.sql.validator` before anything is kept (see `verify_and_filter`), same posture
# `scripts/*` already gets for its own S608 template-building above.
"src/copilot/sql/pair_generation.py" = ["S608", "S311"]
"scripts/generate_sql_pairs.py" = ["S311"]
"tests/test_generate_sql_pairs.py" = ["S311"]
# Day 9 scaffolding (finetuning/): the Colab notebook splits its own train/held-out set with a
# non-cryptographic RNG (S311, same reproducible-shuffle reasoning as generate_sql_pairs.py
# above, not a security boundary) and is linted as a notebook, where ruff's own import-sort
# fixer (I001) can't safely reorder cells without a real Colab run to re-verify against -- same
# "don't let the linter rewrite code it can't run" judgment as the rest of finetuning/'s
# isolation from the strict src/scripts checks (see finetuning/README.md).
"finetuning/day9_qlora_colab.ipynb" = ["S311", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# rank-bm25 ships no type stubs and no py.typed marker; its surface used here (BM25Okapi,
# get_scores) is tiny and stable, so an untyped import is simpler than hand-rolling a stub file.
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy.stats ships no inline types for this version; `scipy-stubs` pulls in its own numpy
# version constraints that fight the rest of this project's pinned stack, and the surface used
# here (norm.ppf) is one call -- same reasoning as rank_bm25 above.
module = "scipy.stats"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# statsforecast and xgboost ship no py.typed marker either; both have a large, fast-moving
# surface not worth hand-stubbing for the handful of calls this project makes into them.
module = ["statsforecast.*", "xgboost.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# shap and this scikit-learn version ship no py.typed marker either -- same reasoning as
# statsforecast/xgboost above: a large surface, a handful of calls, not worth hand-stubbing.
module = ["shap", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
