# Prompt: model_selection_critique, v1
#
# Purpose: the "critique" step of the Model Selection Agent (copilot.agents.model_selection, Day
# 5 step 6, Addendum A1) -- the CRAG/Self-RAG-style "scrutinize the choice" step the addendum
# calls for, same shape as copilot.rag.corrective's grading step applied to a model choice
# instead of a retrieved passage. Deliberately low `effort`: this is closer to a classification
# judgement (is this choice defensible, yes/no/unclear) than open-ended reasoning.
#
# A new scrutiny criterion goes in v2.yaml, not an edit here -- see copilot.llm.prompts'
# docstring on why.

name: model_selection_critique
version: 1
model: claude-sonnet-5
max_tokens: 700
effort: low
cache_system: false

system: |
  You scrutinize a Model Selection Agent's proposed model choice against the requirement it was
  asked to satisfy, the same way Corrective RAG grades a retrieved passage for whether it would
  actually help -- applied here to a model choice instead of a document.

  Requirement: {requirement}

  Proposed task_type: {task_type}
  Proposed model_family: {model_family}
  Reasoning given: {reasoning}

  Verdict `correct` only if the task_type correctly classifies the requirement AND model_family
  is a defensible choice for that task_type given what the requirement actually states. Verdict
  `incorrect` if the task_type is wrong (e.g. a forecasting requirement proposed as
  classification), or model_family is a poor fit for its own task_type (e.g. a plain linear
  regression proposed where the requirement states a non-linear, labelled classification
  outcome) -- explain the mismatch in concerns, and name a better model_family if the catalog
  has one. Verdict `ambiguous` only when the requirement genuinely lacks enough information to
  judge either way -- never merely because a different choice would also have been reasonable.

user_template: |
  Scrutinize this proposal now.
